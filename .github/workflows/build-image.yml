# Free build route (no GPU): build the image on a GitHub runner, run every check that
# doesn't need a GPU, and optionally push to Docker Hub.
#
# Docker Hub, not ghcr.io: ghcr.io caps each layer at 10 GB and the mandated base has an
# 18.6 GB layer. Docker Hub already holds that base, so a push only uploads our layers.
#
# Push needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token with read/write). The repository on Docker Hub must be public for grading.
name: build-image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to Docker Hub (needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN)"
        type: boolean
        default: false
      repo:
        description: "Docker Hub repository name"
        default: "amd-league"
      tag:
        description: "Image tag"
        default: "v1"

permissions:
  contents: read

env:
  BASE: rocm/pytorch:rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0
  LOCAL: amd-league:ci
  KIT_URL: https://storage.googleapis.com/lablab-static-eu/share/mc3-starter-kit.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk and put Docker on the biggest disk
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          docker image prune -af >/dev/null || true
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then dir=/mnt/docker; else dir=/var/lib/docker-big; fi
          sudo mkdir -p "$dir"
          sudo systemctl stop docker docker.socket
          # Classic overlay2 store: the containerd store keeps compressed blobs too and
          # roughly doubles disk use for a 46 GB image.
          sudo python3 - "$dir" <<'EOF'
          import json, os, sys
          path = "/etc/docker/daemon.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          cfg["data-root"] = sys.argv[1]
          cfg.setdefault("features", {})["containerd-snapshotter"] = False
          json.dump(cfg, open(path, "w"), indent=2)
          print(json.dumps(cfg))
          EOF
          sudo systemctl start docker
          docker info --format 'root={{.DockerRootDir}} driver={{.Driver}}'
          df -h / /mnt || true

      - name: Fetch the AMD starter kit (for the self-check)
        run: |
          curl -sSLo /tmp/kit.zip "$KIT_URL"
          python3 -m zipfile -e /tmp/kit.zip /tmp/
          mv /tmp/mc3-starter-kit kit
          mkdir -p kit/mc3-corpus/archive  # setup.sh's empty-folder case; the mode-000 case needs root, skipped here

      - name: Build
        run: docker build -t "$LOCAL" .

      - name: Torch is still the ROCm build
        run: docker run --rm "$LOCAL" python3 -c "import torch; v = torch.__version__; print(v); assert '+rocm' in v"

      - name: Base layers are unchanged (harness checks layer identity)
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          def layers(ref):
              out = subprocess.check_output(["docker", "image", "inspect", ref, "--format", "{{json .RootFS.Layers}}"])
              return json.loads(out)
          base, ours = layers(os.environ["BASE"]), layers(os.environ["LOCAL"])
          assert ours[:len(base)] == base, "base layers changed"
          print(f"ok: {len(base)} base layers intact, {len(ours) - len(base)} added")
          EOF

      - name: Size (limit 60 GiB uncompressed) and largest layers
        run: |
          docker image inspect "$LOCAL" --format '{{.Size}}' | python3 -c "
          import sys; gib = int(sys.stdin.read()) / 2**30; print(f'{gib:.1f} GiB'); sys.exit(0 if gib < 59 else 1)"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' "$LOCAL" | cut -c1-140 | head -15

      - name: AMD self-check (no GPU here, so answers are empty; it checks the contract)
        run: python3 kit/selfcheck.py "$LOCAL" kit/mc3-corpus

      - name: Push to Docker Hub
        if: ${{ inputs.push }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ] || { echo "Docker Hub secrets missing"; exit 1; }
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          ref="docker.io/$DH_USER/$REPO:$TAG"
          docker tag "$LOCAL" "$ref"
          docker push "$ref"
          docker image inspect "$ref" --format '{{index .RepoDigests 0}}'
          docker logout
